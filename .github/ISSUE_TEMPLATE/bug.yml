name: Bug report
description: Something isn't working as expected.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App and Mac details
      placeholder: Wixal version, macOS version, Apple Silicon model
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Ollama and model
      placeholder: Ollama version and exact model name
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private paths, conversations and credentials before sharing.
