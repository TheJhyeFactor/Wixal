<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="434" viewBox="0 0 1200 434" role="img" aria-labelledby="title desc">
<title id="title">Wixal 0.6.0 — tools that work, context that stays</title><desc id="desc">Project recall and saved summaries, reviewed web and API requests, external MCP tools, and local model downloads.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#202025"/><stop offset="1" stop-color="#151619"/></linearGradient></defs>
<rect width="1200" height="434" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="432" rx="19" fill="none" stroke="#37323a"/>
<g font-family="Helvetica,Arial,sans-serif"><text x="38" y="48" fill="#e9a5bd" font-family="Menlo,monospace" font-size="12" letter-spacing="2">WIXAL / 0.6.0</text>
<text x="38" y="101" fill="#e8e7e5" font-size="34" font-weight="600">Tools that work. Context that stays.</text><text x="38" y="135" fill="#96979e" font-size="16">Bring your project. Choose your model. Review the action.</text>
<g transform="translate(38 172)"><rect width="553" height="104" rx="12" fill="#242128" stroke="#49404b"/><circle cx="36" cy="35" r="17" fill="#3c2c36"/><path d="M29 27h14v15H29zm3 4h8m-8 4h8m-8 4h5" fill="none" stroke="#e9a5bd" stroke-width="1.7"/><text x="67" y="38" fill="#e8e7e5" font-size="19" font-weight="600">Recall the project</text><text x="67" y="66" fill="#aaa4b1" font-size="14">Saved notes, history search and automatic summaries.</text><text x="67" y="87" fill="#aaa4b1" font-size="14">Keep the original conversation on your Mac.</text></g>
<g transform="translate(609 172)"><rect width="553" height="104" rx="12" fill="#242128" stroke="#49404b"/><circle cx="36" cy="35" r="17" fill="#3c2c36"/><circle cx="36" cy="35" r="9" fill="none" stroke="#e9a5bd" stroke-width="1.7"/><path d="M27 35h18m-9-9q-9 9 0 18m0-18q9 9 0 18" fill="none" stroke="#e9a5bd" stroke-width="1.4"/><text x="67" y="38" fill="#e8e7e5" font-size="19" font-weight="600">Reach the web</text><text x="67" y="66" fill="#aaa4b1" font-size="14">Source links, page text and JSON API requests.</text><text x="67" y="87" fill="#aaa4b1" font-size="14">Review what leaves your Mac before sending.</text></g>
<g transform="translate(38 292)"><rect width="553" height="104" rx="12" fill="#242128" stroke="#49404b"/><circle cx="36" cy="35" r="17" fill="#3c2c36"/><path d="M31 26v8m10-8v8m-13 0h16v3a8 8 0 0 1-16 0zm8 11v7" fill="none" stroke="#e9a5bd" stroke-width="1.7"/><text x="67" y="38" fill="#e8e7e5" font-size="19" font-weight="600">Connect your tools</text><text x="67" y="66" fill="#aaa4b1" font-size="14">Local MCP servers, individual controls and real results.</text><text x="67" y="87" fill="#aaa4b1" font-size="14">Each call shows its server, tool and arguments.</text></g>
<g transform="translate(609 292)"><rect width="553" height="104" rx="12" fill="#242128" stroke="#49404b"/><circle cx="36" cy="35" r="17" fill="#3c2c36"/><path d="M36 25v14m-6-6 6 6 6-6m-15 8v5h18v-5" fill="none" stroke="#e9a5bd" stroke-width="1.7"/><text x="67" y="38" fill="#e8e7e5" font-size="19" font-weight="600">Choose a bigger model</text><text x="67" y="66" fill="#aaa4b1" font-size="14">Download Ollama models with progress and cancellation.</text><text x="67" y="87" fill="#aaa4b1" font-size="14">Select up to 128k context when your model supports it.</text></g></g></svg>
